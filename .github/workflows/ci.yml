name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/**"
      - "AGENTS.md"
      - "Dockerfile"
      - "Makefile"
      - "README.md"
      - "configs/**"
      - "docker-compose.yml"
      - "cmd/**"
      - "internal/**"
      - "pkg/**"
      - "scripts/**"
      - "packaging/**"
      - "docs/**"
      - "go.mod"
      - "go.sum"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go and docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run Dockerized Phase 7 checks
        run: docker compose run --rm phase7-hardening-checks
